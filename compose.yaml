services:
  caption-studio:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.5.1}
        VCS_REF: ${VCS_REF:-local}
    image: ghcr.io/suyaleo/caption-studio:${IMAGE_TAG:-local}
    ports:
      - "${CAPTION_STUDIO_PORT:-8788}:8788"
    environment:
      CAPTION_STUDIO_WORKSPACE: /data/workspace
      CAPTION_STUDIO_MAX_UPLOAD_BYTES: ${CAPTION_STUDIO_MAX_UPLOAD_BYTES:-4294967296}
      CAPTION_ASR_PROVIDER: faster-whisper
      CAPTION_ASR_DEVICE: ${CAPTION_ASR_DEVICE:-cpu}
      CAPTION_ASR_COMPUTE_TYPE: ${CAPTION_ASR_COMPUTE_TYPE:-int8}
      CAPTION_ASR_DOWNLOAD_ROOT: /data/models
      CAPTION_ASR_BEAM_SIZE: ${CAPTION_ASR_BEAM_SIZE:-5}
      CAPTION_TRANSLATION_BASE_URL: ${CAPTION_TRANSLATION_BASE_URL:-http://host.docker.internal:8000/v1}
      CAPTION_TRANSLATION_API_KEY: ${CAPTION_TRANSLATION_API_KEY:-local}
      CAPTION_TRANSLATION_MODEL: ${CAPTION_TRANSLATION_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - caption-studio-data:/data
    restart: unless-stopped

volumes:
  caption-studio-data:
