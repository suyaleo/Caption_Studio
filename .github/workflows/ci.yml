name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application
        run: pip install -e .

      - name: Validate Studio release contract
        run: python scripts/validate_studio_repo.py --mode release

      - name: Test Python application
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and test Web
        working-directory: web
        run: |
          npm run typecheck
          npm test

      - name: Build production Web
        working-directory: web
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=0.5.0 \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag caption-studio:ci .

      - name: Inspect runtime contract
        run: |
          test "$(docker image inspect caption-studio:ci --format '{{.Config.User}}')" = "studio"
          test "$(docker image inspect caption-studio:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "Apache-2.0"
          test "$(docker image inspect caption-studio:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/suyaleo/Caption_Studio"

      - name: Exercise persistent upload and hard-sub render
        run: bash scripts/docker_smoke_test.sh caption-studio:ci
